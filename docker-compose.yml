# Prod-like local stack: MySQL 8.4 + telecom-upload-service (prod profile, Flyway).
# Uploaded files persist in the "uploads" volume; DB rows in "mysql-data".
name: telecom-upload

services:
  mysql:
    image: mysql:8.4
    container_name: telecom-upload-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-telecomdb}
      MYSQL_USER: ${MYSQL_USER:-telecom_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-telecom_pass_change_me}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: telecom-upload-service:1.0.0
    container_name: telecom-upload-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-telecomdb}
      DB_USERNAME: ${MYSQL_USER:-telecom_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-telecom_pass_change_me}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      TELECOM_STORAGE_LOCATION: /app/data/uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-20MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-60MB}
      TELECOM_STORAGE_MAX_STREAM_SIZE: ${TELECOM_STORAGE_MAX_STREAM_SIZE:-200MB}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/data/uploads

  adminer:
    image: adminer:4
    container_name: telecom-upload-adminer
    profiles: ["tools"]
    depends_on: [mysql]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"

volumes:
  mysql-data:
  uploads:
