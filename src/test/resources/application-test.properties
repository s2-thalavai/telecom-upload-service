# Test profile: in-memory H2 and deliberately SMALL limits so size rules are cheap to test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=0B
server.tomcat.max-swallow-size=20MB

telecom.storage.max-stream-size=2MB
telecom.storage.max-files-per-batch=3
telecom.import.batch-size=2
telecom.import.max-reported-errors=5
# telecom.storage.location is set per test class via @DynamicPropertySource (temp directory)

logging.level.com.telecom=INFO
