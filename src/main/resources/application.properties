# =====================================================================
# Common configuration. Profiles: dev (default, H2), prod (MySQL), test (tests)
# =====================================================================
spring.application.name=telecom-upload-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# ---------- Multipart upload limits (StandardServletMultipartResolver) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB
# Parts <= 512KB stay in memory, larger parts spill to a temp file
spring.servlet.multipart.file-size-threshold=512KB
spring.servlet.multipart.resolve-lazily=false
# Optional dedicated temp dir (must exist; avoids OS /tmp cleaners):
#spring.servlet.multipart.location=/var/tmp/telecom-multipart

# ---------- Embedded Tomcat ----------
# Read & discard up to this much of a rejected body so clients get a clean 413
server.tomcat.max-swallow-size=60MB
server.tomcat.connection-timeout=60s

# Java 21 virtual threads: blocking uploads do not exhaust the request thread pool
spring.threads.virtual.enabled=true

# ---------- Application storage & import (StorageProperties / ImportProperties) ----------
telecom.storage.location=${TELECOM_STORAGE_LOCATION:./data/uploads}
telecom.storage.allowed-content-types=application/pdf,image/jpeg,image/png
# Hard limit for the raw streaming endpoint (not covered by the multipart limits)
telecom.storage.max-stream-size=200MB
telecom.storage.max-files-per-batch=10
telecom.import.batch-size=500
telecom.import.max-reported-errors=100

# ---------- JPA ----------
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# ---------- Errors as RFC 9457 ProblemDetail ----------
spring.mvc.problemdetails.enabled=true

# ---------- Actuator (Docker HEALTHCHECK + K8s probes) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
